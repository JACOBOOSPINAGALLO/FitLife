name: CI y publicación de imágenes

on:
  push:
    branches:
      - main

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            directory: gateway
            context: .
            dockerfile: gateway/Dockerfile
          - service: usuarios
            directory: usuarios-service
            context: ./usuarios-service
            dockerfile: ./usuarios-service/Dockerfile
          - service: planes
            directory: planes-service
            context: ./planes-service
            dockerfile: ./planes-service/Dockerfile
          - service: membresias
            directory: membresias-service
            context: ./membresias-service
            dockerfile: ./membresias-service/Dockerfile

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Instalar dependencias
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Ejecutar pruebas
        working-directory: ${{ matrix.directory }}
        run: npm test

      - name: Preparar etiqueta SHA corta
        id: commit
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fitlife-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fitlife-${{ matrix.service }}:sha-${{ steps.commit.outputs.sha_short }}
